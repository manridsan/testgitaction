name: Schedule Test

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show execution time
        run: date -u

      - name: Show IST time
        run: date -u -d '+5 hours 30 minutes'
        run: cat test
